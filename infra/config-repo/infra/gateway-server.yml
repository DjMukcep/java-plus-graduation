spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: false
            max-age: 3600
      discovery:
        locator:
          enabled: false
      routes:
        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/categories,/admin/categories/**,/admin/compilations,/admin/compilations/**,/admin/events,/admin/events/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/*/events,/users/*/events/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: event-service-internal-block
          uri: no://op
          predicates:
            - Path=/events/exists/**
            - Method=GET
          filters:
            - SetStatus=404

        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/categories,/categories/**,/compilations,/compilations/**,/events,/events/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: user-service-internal-get-block
          uri: no://op
          predicates:
            - Path=/admin/users/*/exists,/admin/users/*/comments,/admin/users/*
            - Method=GET
          filters:
            - SetStatus=404

        - id: user-service-internal-patch-block
          uri: no://op
          predicates:
            - Path=/admin/users/comments/**,/admin/users/*/warning
            - Method=PATCH
          filters:
            - SetStatus=404

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**,/admin/comments/**,/users/*/comments,/users/*/comments/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: request-service-internal-block
          uri: no://op
          predicates:
            - Path=/users/requests,/users/requests/**,/users/requests/count
            - Method=GET,PATCH
          filters:
            - SetStatus=404

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests,/users/*/requests/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true